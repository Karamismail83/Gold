<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>ذهبي</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f9;--surface:#ffffff;--ink:#0d2745;--muted:#6a7f98;--line:#e0e8f2;--accent:#0b5cb5;--accent2:#0a3f82;--accent-ink:#ffffff;--brass:#0b5cb5;--soft:#e8f1fc;--pos:#16895a;--neg:#d23c3c;--k24:#d99a1e;--k21:#10a08a;--k18:#e0527c;--gold:#f0c64a;--sh:0 4px 16px rgba(10,60,130,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#061426;--surface:#0e2644;--ink:#e8f1fc;--muted:#8fa7c4;--line:#1c3a60;--accent:#3b97f2;--accent2:#1c6fc4;--brass:#3b97f2;--soft:#12335c;--pos:#4fd39a;--neg:#ff7b7b;--k24:#f0b13a;--k21:#2fd0b8;--k18:#f27a9d;--sh:0 4px 16px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#061426;--surface:#0e2644;--ink:#e8f1fc;--muted:#8fa7c4;--line:#1c3a60;--accent:#3b97f2;--accent2:#1c6fc4;--brass:#3b97f2;--soft:#12335c;--pos:#4fd39a;--neg:#ff7b7b;--k24:#f0b13a;--k21:#2fd0b8;--k18:#f27a9d;--sh:0 4px 16px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 380px at 50% -80px,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:400 15px/1.5 "Cairo",system-ui,sans-serif}
h1,h2,.num-lg{font-family:"Cairo",system-ui,sans-serif;font-weight:700;margin:0}
h2{font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:5px;height:1.1em;border-radius:3px;background:linear-gradient(var(--gold),#c98a10)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:8px 12px 100px}
header{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:10px;border-radius:20px;background:linear-gradient(135deg,rgba(11,92,181,.78) 0%,rgba(10,63,130,.72) 55%,rgba(7,44,92,.9) 100%),var(--gimg) center 35%/cover,#0a3f82;color:#fff;box-shadow:0 10px 30px rgba(10,60,130,.3),inset 0 0 0 1px rgba(240,198,74,.35)}
header::before{content:"";position:absolute;width:240px;height:240px;inset-inline-end:-60px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(240,198,74,.45),transparent 65%)}
header::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.14) 50%,transparent 60%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){header::after{animation:none}}
header>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:16px;flex:none;padding:3px;background:linear-gradient(135deg,#fff3b8,#f0c64a 45%,#b8800f);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:13px;display:block}
header h1{font-size:1.5rem;line-height:1.2;letter-spacing:.5px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.sub{font-size:.76rem;opacity:.85;line-height:1.4;color:#ffe9a6}
.tools{display:flex;gap:8px}
.tools .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff;border-radius:20px;padding:6px 12px;min-height:36px;font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:38px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#f6d567,#d99a1e);color:#3a2600;border-color:transparent;font-weight:700;box-shadow:0 4px 14px rgba(217,154,30,.4)}
.btn[disabled]{opacity:.6;cursor:progress}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--soft);margin-bottom:10px}
.seg button{border:0;background:none;padding:7px;cursor:pointer;font-weight:600;border-radius:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--sh)}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(10,60,130,.14);padding:6px 6px env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 2px;cursor:pointer;font-size:.74rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:14px}
nav button *{pointer-events:none}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--soft)}
@media(min-width:800px){nav{position:static;border-radius:16px;margin-bottom:20px;padding:4px;box-shadow:var(--sh)}nav button{flex-direction:row;justify-content:center;gap:8px;font-size:1rem;padding:8px}.wrap{padding-bottom:40px}}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k3 label{font-size:.82rem}
.k4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.k4 label{font-size:1.1rem;white-space:nowrap;text-align:center;font-weight:700;margin-bottom:6px}.k4 input{text-align:center;padding:10px 4px}.tval{display:block;padding:10px 4px;border:1px solid var(--gold);border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 30%,var(--soft)),var(--soft));font-weight:700;font-size:.85rem;text-align:center;overflow-wrap:anywhere;min-height:44px;color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
a{color:var(--accent)}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:6px 0;border-bottom:1px solid var(--line)}
.ledger tr:last-child td{border:0}
.ledger td:last-child{text-align:start;font-weight:700;font-variant-numeric:tabular-nums}
.ledger small{color:var(--muted);font-weight:400;display:block}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.thumb{width:56px;height:56px;border-radius:14px;background:var(--soft);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--brass);font-family:"Cairo";font-weight:700;font-size:1.1rem}
.item b{display:block}.item span{color:var(--muted);font-size:.88rem}
.del{border:0;background:none;color:var(--neg);cursor:pointer;padding:8px}
.empty{color:var(--muted);padding:12px 0}
.verdict{padding:14px;border-radius:14px;border-inline-start:4px solid var(--gold);background:var(--soft)}
.sheet{max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.kcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:7px 8px;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 28%,transparent);background-image:linear-gradient(color-mix(in srgb,var(--c) 14%,transparent),color-mix(in srgb,var(--c) 4%,transparent))}
.kcard b{display:flex;align-items:center;gap:5px;font-weight:700;font-size:.9rem}
.kcard b::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.kcard .num-lg{font-size:1.4rem}
.kcard small{display:inline;font-size:.9rem;margin-inline-start:4px;font-family:Cairo;color:var(--muted)}
.kcard span{display:block;color:var(--muted);font-size:.75rem;line-height:1.4}
.grp{margin-bottom:10px}
.gh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:12px;border-inline-start:6px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));font-weight:700}
.gh span{font-weight:400;color:var(--muted);font-size:.9rem}
.grp .thumb{border:2px solid var(--c);color:var(--c);font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap}.item,.thumb{cursor:pointer}

/* ===== eye-catching layer ===== */
header h1{background:linear-gradient(180deg,#fffbe0 0%,#f6d567 50%,#d99a1e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));font-size:1.7rem}
.logo{animation:glow 3.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 0 rgba(240,198,74,.55)}50%{box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 9px rgba(240,198,74,0)}}
header{border:1px solid rgba(240,198,74,.55)}
.panel{position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--gold) 35%,var(--line))}
.panel::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.kcard{position:relative;overflow:hidden;animation:rise .5s ease both}
.kcard:nth-child(2){animation-delay:.08s}.kcard:nth-child(3){animation-delay:.16s}
.kcard::after{content:"";position:absolute;width:70px;height:70px;inset-inline-end:-22px;bottom:-26px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kcard .num-lg{font-size:1.65rem;background:linear-gradient(180deg,var(--ink),var(--c));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.btn.primary{position:relative;overflow:hidden;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 14px rgba(217,154,30,.4)}50%{box-shadow:0 4px 22px rgba(240,198,74,.85)}}
.btn:hover{border-color:var(--gold)}
.tval{box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#f6d567,#d99a1e);color:#3a2600;box-shadow:0 4px 12px rgba(217,154,30,.45)}
nav{border-top:2px solid var(--gold)}
nav button[aria-current="page"]{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 35%,var(--soft)),var(--soft));color:var(--accent2)}
.gh{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 28%,var(--surface)),var(--surface))}
.item:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.verdict{background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 22%,var(--soft)),var(--soft))}
@media (prefers-reduced-motion:reduce){.logo,.kcard,.btn.primary{animation:none}}

/* ===== fit-to-screen layout ===== */
html,body{height:100%}
body{font-size:14px;line-height:1.4;overflow:hidden}
.wrap{height:calc(100dvh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:6px 10px 0;max-width:860px}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:4px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
nav{position:static;order:3;margin:4px -10px 0;border-radius:16px 16px 0 0;padding:3px 6px env(safe-area-inset-bottom,0px);flex:none}
nav button{padding:3px 2px;font-size:.66rem;gap:0}
nav button svg{width:20px;height:20px}
@media(min-width:800px){nav{margin:4px 0 0;border-radius:14px;flex-direction:row}nav button{flex-direction:row;font-size:.85rem}}
header{padding:6px 10px;margin-bottom:6px;border-radius:16px;flex:none}
.logo{width:38px;height:38px;border-radius:12px;padding:2px}.logo img{border-radius:10px}
header h1{font-size:1.25rem}
.tools .btn{min-height:28px;padding:2px 10px;font-size:.78rem}
.brand{gap:10px}
.seg{margin-bottom:6px;padding:3px;flex:none}.seg button{padding:5px;font-size:.85rem}
.panel{padding:8px 10px;margin-bottom:6px;border-radius:14px}
h2{font-size:.9rem;margin-bottom:5px}
label{font-size:.78rem;margin-bottom:1px}
input,select,textarea{padding:4px 8px;font-size:.9rem;border-radius:10px}
.k4 label{font-size:.95rem;margin-bottom:2px}.k4 input{padding:5px 2px}
.tval{min-height:32px;padding:4px 2px;font-size:.75rem}
.kgrid{gap:5px;margin-bottom:6px}
.kcard{padding:5px 7px;border-top-width:4px}
.kcard b{font-size:.8rem}.kcard .num-lg{font-size:1.25rem;line-height:1.2}.kcard small{font-size:.75rem}.kcard span{font-size:.66rem;line-height:1.2}
.ledger td{padding:3px 0;font-size:.85rem}
.btn{min-height:32px;padding:3px 10px;font-size:.88rem}
.btns{gap:6px}
.hint{margin-top:2px;font-size:.7rem}.hint:empty{display:none}
.fields{gap:6px}
.item{padding:5px 0;grid-template-columns:44px 1fr auto;gap:8px}.thumb{width:44px;height:44px;border-radius:10px}
.gh{padding:4px 8px;font-size:.85rem}.grp{margin-bottom:6px}
textarea{rows:1}

/* ===== velvet: one deep tone + gold accent ===== */
:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#0a1a33;--surface:#10264a;--ink:#efe6cf;--muted:#9fb0c8;--line:rgba(214,176,84,.2);--accent:#d6b054;--accent2:#b8913a;--brass:#d6b054;--gold:#d6b054;--soft:#173560;--pos:#8fd1a8;--neg:#e58a8a;--k24:#e6c766;--k21:#c9a24a;--k18:#c28c70;--sh:0 10px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 28px rgba(0,0,0,.28)}
:root[data-theme="light"]{--bg:#e9e2d2;--surface:#f6f0e2;--ink:#2b2418;--muted:#7a6d56;--line:rgba(150,115,40,.25);--accent:#9a7420;--accent2:#7d5d16;--brass:#9a7420;--gold:#b8913a;--soft:#ebe2cc;--pos:#2f7a54;--neg:#b34444;--k24:#b8860b;--k21:#9a7420;--k18:#a0624a;--sh:0 8px 18px rgba(80,60,20,.15),inset 0 1px 0 rgba(255,255,255,.6)}
body{background-color:var(--bg);background-image:radial-gradient(700px 320px at 50% -60px,rgba(214,176,84,.14),transparent 70%),radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.2px);background-size:auto,3px 3px;background-repeat:no-repeat,repeat}
header{background:linear-gradient(145deg,#173560,#0d2243 70%),#0d2243;border:1px solid var(--line);box-shadow:var(--sh)}
header::before,header::after{display:none}
.logo{animation:none;box-shadow:0 0 0 1px rgba(214,176,84,.5),0 4px 10px rgba(0,0,0,.45);background:#d6b054}
header h1{background:none;-webkit-text-fill-color:#e9d08a;color:#e9d08a;filter:none;letter-spacing:.5px}
.tools .btn{background:rgba(255,255,255,.07);border-color:var(--line);color:#e9d08a}
.panel,.kcard{background-color:var(--surface);background-image:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%);border:1px solid var(--line);box-shadow:var(--sh)}
.panel::before{background:linear-gradient(90deg,transparent,rgba(214,176,84,.55),transparent);height:1px}
.kcard{border-top:1px solid var(--line);animation:none}
.kcard::after{display:none}
.kcard b::before{box-shadow:none}
.kcard .num-lg{background:none;-webkit-text-fill-color:var(--c);color:var(--c)}
.btn{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.primary{animation:none;background:linear-gradient(145deg,#e0c06a,#b8913a);color:#241a05;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.seg{background:rgba(0,0,0,.28);box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.seg button[aria-pressed="true"]{background:linear-gradient(145deg,#e0c06a,#b8913a);color:#241a05;box-shadow:0 2px 6px rgba(0,0,0,.4)}
nav{background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.35)}
nav button[aria-current="page"]{background:rgba(214,176,84,.14);color:var(--accent)}
.tval{background:rgba(0,0,0,.22);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);border-color:var(--line);color:var(--accent)}
input,select,textarea{background:rgba(0,0,0,.22);border-color:var(--line);box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
.gh{background:rgba(255,255,255,.05)}
.item:hover{background:rgba(214,176,84,.06)}
.verdict{background:rgba(0,0,0,.22);box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea,:root[data-theme="light"] .tval,:root[data-theme="light"] .verdict{background:rgba(255,255,255,.55);box-shadow:inset 0 1px 3px rgba(80,60,20,.15)}
:root[data-theme="light"] header{background:linear-gradient(145deg,#173560,#0d2243)}

/* ===== pampered velvet ===== */
body{background-image:radial-gradient(700px 320px at 50% -60px,rgba(214,176,84,.2),transparent 70%),radial-gradient(circle at 12% 28%,rgba(240,214,140,.16) 0 1.5px,transparent 2px),radial-gradient(circle at 86% 18%,rgba(240,214,140,.14) 0 1.5px,transparent 2px),radial-gradient(circle at 72% 62%,rgba(240,214,140,.1) 0 1.5px,transparent 2px),radial-gradient(circle at 24% 80%,rgba(240,214,140,.12) 0 1.5px,transparent 2px),radial-gradient(rgba(255,255,255,.04) 1px,transparent 1.2px);background-size:auto,auto,auto,auto,auto,3px 3px;background-repeat:no-repeat,no-repeat,no-repeat,no-repeat,no-repeat,repeat;background-attachment:fixed}
header{border-radius:22px;box-shadow:var(--sh),inset 0 0 0 3px #0d2243,inset 0 0 0 4px rgba(214,176,84,.45);padding:8px 14px}
header h1{text-shadow:0 0 14px rgba(214,176,84,.45),0 2px 4px rgba(0,0,0,.5);font-size:1.4rem}
.logo{box-shadow:0 0 0 2px rgba(214,176,84,.6),0 0 16px rgba(214,176,84,.45),0 4px 10px rgba(0,0,0,.45)}
.panel{border-radius:18px;background-image:radial-gradient(220px 90px at 85% 0,rgba(255,255,255,.09),transparent 70%),linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,0) 55%)}
.panel::after{content:"";position:absolute;inset:3px;border:1px solid rgba(214,176,84,.12);border-radius:15px;pointer-events:none}
h2{color:var(--accent);letter-spacing:.3px}
h2::before{content:"◆";width:auto;height:auto;background:none;font-size:.7em;color:var(--gold);text-shadow:0 0 8px rgba(214,176,84,.7)}
.kcard{border-radius:16px;box-shadow:var(--sh),0 0 14px color-mix(in srgb,var(--c) 22%,transparent);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.kcard::before{content:"";position:absolute;inset-inline:14%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.kcard .num-lg{text-shadow:0 0 12px color-mix(in srgb,var(--c) 55%,transparent)}
.btn{border-radius:14px;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{box-shadow:0 0 12px rgba(214,176,84,.35)}
.btn.primary{box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 14px rgba(214,176,84,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.seg{border-radius:16px;border:1px solid var(--line)}
.seg button[aria-pressed="true"]{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 12px rgba(214,176,84,.4)}
nav{border-radius:20px 20px 0 0}

/* قص مربع من الصورة الأصلية بدون تصغير (حتى 2000px) */
const crop=(im,max=2000)=>{const q=Math.min(im.naturalWidth,im.naturalHeight),o=Math.min(q,max),c=document.createElement("canvas");c.width=c.height=o;const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(im,(im.naturalWidth-q)/2,(im.naturalHeight-q)/2,q,q,0,0,o,o);return c};
const dl=async(name,data)=>{
  try{const d=window.claude?await window.claude.use("downloads"):null;if(d){await d.save({filename:name,data});return}}catch(e){return}
  const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
const fname=ext=>"gold-"+({"Gold yassmin":"yassmin","Karam Gold":"karam",both:"both"}[S.scope||S.cat])+"."+ext;
const reports=async()=>{const cs=S.scope==="both"?CATS:[S.scope||S.cat],pages=[],imgs={};for(const c of cs){const R=await buildReport(c);if(R){pages.push(...R.pages);Object.assign(imgs,R.imgs)}}return pages.length?{pages,imgs}:null};
const busy=async(btn,fn)=>{btn.disabled=true;$("busy").textContent=T[S.lang].making;await new Promise(r=>setTimeout(r,30));let m="";try{m=await fn()}catch(e){console.error(e)}$("busy").textContent=m||"";btn.disabled=false};
$("pdf").onclick=e=>busy(e.currentTarget,async()=>{
  const R=await reports();if(!R)return T[S.lang].none;if(!window.jspdf)return;
  const pdf=new window.jspdf.jsPDF({unit:"px",format:[W,H],compress:true});
  R.pages.forEach((p,k)=>{
    if(k)pdf.addPage([W,H]);
    pdf.addImage(p.c.toDataURL("image/jpeg",.98),"JPEG",0,0,W,H,undefined,"NONE");
    p.photos.forEach(ph=>pdf.addImage(R.imgs[ph.id],"JPEG",ph.x,ph.y,ph.s,ph.s,undefined,"NONE"));
  });
  await dl(fname("pdf"),pdf.output("blob"));
});
$("png").onclick=e=>busy(e.currentTarget,async()=>{
  const R=await reports();if(!R)return T[S.lang].none;
  const N=R.pages.length,f=Math.min(SC,Math.sqrt(1.6e7/(W*H*N))),c=document.createElement("canvas");c.width=Math.round(W*f);c.height=Math.round(H*f*N);const x=c.getContext("2d");x.imageSmoothingQuality="high";
  for(let k=0;k<N;k++){const p=R.pages[k];x.drawImage(p.c,0,k*H*f,W*f,H*f);for(const ph of p.photos){const im=await loadImg(R.imgs[ph.id]);if(im)x.drawImage(im,ph.x*f,k*H*f+ph.y*f,ph.s*f,ph.s*f)}}
