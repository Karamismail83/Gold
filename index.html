<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل مشتريات الذهب</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ea;--surface:#ffffff;--ink:#1a1a1a;--muted:#6e6a5e;--line:#ddd8c8;--accent:#151515;--accent-ink:#f0d17a;--brass:#b8912f;--pos:#1d7a4a;--neg:#b3392f;--k24:#c9a227;--k21:#1f8f7f;--k18:#c0456f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--surface:#171717;--ink:#efe9d6;--muted:#a39b84;--line:#2e2b22;--accent:#d4af37;--accent-ink:#121212;--brass:#d4af37;--pos:#5fcf92;--neg:#ee7d72;--k24:#e6c04a;--k21:#3cc2ae;--k18:#ef6f98}}
:root[data-theme="dark"]{--bg:#0c0c0c;--surface:#171717;--ink:#efe9d6;--muted:#a39b84;--line:#2e2b22;--accent:#d4af37;--accent-ink:#121212;--brass:#d4af37;--pos:#5fcf92;--neg:#ee7d72;--k24:#e6c04a;--k21:#3cc2ae;--k18:#ef6f98}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Cairo",system-ui,sans-serif}
h1,h2,.num-lg{font-family:"Amiri","Cairo",sans-serif;font-weight:600;margin:0}
h2{font-size:1.3rem;margin-bottom:14px}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:12px 16px 110px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:6px 0 12px}
header h1{font-size:1.4rem}
.tools{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:18px}
.seg button{border:0;background:none;padding:11px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:12px 2px;cursor:pointer;font-size:.82rem;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--accent);font-weight:600;border-top-color:var(--brass)}
@media(min-width:800px){nav{position:static;border:1px solid var(--line);border-radius:10px;margin-bottom:20px;padding:0;overflow:hidden}nav button{font-size:1rem;border-top:0;border-bottom:3px solid transparent}nav button[aria-current="page"]{border-bottom-color:var(--brass)}.wrap{padding-bottom:40px}}
.view[hidden]{display:none}
.hero{padding:26px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}
.hero small{opacity:.8;display:block}
.num-lg{font-size:clamp(2rem,9vw,3.4rem);line-height:1.1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k3 label{font-size:.82rem}
.k4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.k4 label{font-size:1.1rem;white-space:nowrap;text-align:center;font-weight:600;margin-bottom:6px}.k4 input{text-align:center}.k4 input{padding:10px 4px}.tval{display:block;padding:10px 4px;border:1px solid var(--brass);border-radius:8px;background:color-mix(in srgb,var(--brass) 16%,var(--surface));font-weight:600;font-size:.85rem;text-align:center;overflow-wrap:anywhere;min-height:44px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
a{color:var(--accent)}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:11px 0;border-bottom:1px solid var(--line)}
.ledger tr:last-child td{border:0}
.ledger td:last-child{text-align:start;font-weight:600;font-variant-numeric:tabular-nums}
.ledger small{color:var(--muted);font-weight:400;display:block}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--bg);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--brass);font-family:"Amiri";font-size:1.1rem}
.item b{display:block}.item span{color:var(--muted);font-size:.88rem}
.del{border:0;background:none;color:var(--neg);cursor:pointer;padding:8px}
.empty{color:var(--muted);padding:12px 0}
.verdict{padding:14px;border-radius:8px;border-inline-start:4px solid var(--brass);background:var(--bg)}
.sheet{max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.kcard{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:12px 14px;background-image:linear-gradient(color-mix(in srgb,var(--c) 12%,transparent),color-mix(in srgb,var(--c) 12%,transparent))}
.kcard b{display:flex;align-items:center;gap:8px;font-weight:600}
.kcard b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.kcard{padding:10px 8px}.kcard b{font-size:.9rem;gap:5px}.kcard b::before{width:9px;height:9px}.kcard .num-lg{font-size:1.4rem}.kcard span{font-size:.75rem;line-height:1.4}
.kcard small{display:inline;font-size:.9rem;margin-inline-start:4px;font-family:Cairo;color:var(--muted)}
.kcard span{display:block;color:var(--muted);font-size:.85rem}
.grp{margin-bottom:14px}
.gh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-radius:8px;border-inline-start:6px solid var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surface));font-weight:600}
.gh span{font-weight:400;color:var(--muted);font-size:.9rem}
.grp .thumb{border:2px solid var(--c);color:var(--c);font-weight:600}
.btns{display:flex;gap:10px;flex-wrap:wrap}
#printArea{display:none}
.pa{background:#fff;color:#111;font-family:Cairo,system-ui,sans-serif;padding:8px}
.pa h1{font-size:20px;margin:0 0 2px}.pa p{margin:0 0 12px;color:#555;font-size:13px}
.pg{margin:0 0 14px;border:1.5px solid var(--c);border-radius:8px;overflow:hidden}
.pg .gh{background:color-mix(in srgb,var(--c) 28%,#fff);border-radius:0;color:#111}
.pg .gh span{color:#333}
.pr{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:6px 12px;border-top:1px solid #ddd;break-inside:avoid;font-size:14px}
.pr .thumb{width:48px;height:48px;border:2px solid var(--c);color:var(--c);background:#fff}
.pr small{display:block;color:#555}
.pa .tot{font-weight:600;border-top:2px solid #111;padding-top:8px;display:flex;justify-content:space-between}
@media print{.wrap{display:none!important}#printArea{display:block}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 data-i="title"></h1>
  <div class="tools">
    <button class="btn" id="lang"></button>
    <button class="btn" id="theme"></button>
  </div>
</header>
<div class="seg" role="group" id="seg"></div>

<nav id="nav"></nav>

<main>
<section class="view" data-v="home">
  <div class="kgrid" id="kgrid"></div>

  <div class="panel"><table class="ledger" id="ledger"></table></div>
  <div class="btns"><button class="btn primary" id="pdf" data-i="savePdf"></button><button class="btn" id="png" data-i="savePng"></button></div>
</section>

<section class="view" data-v="add" hidden>
  <div class="panel">
    <h2 data-i="add"></h2>
    <form id="form" class="fields">
      <div><label for="type" data-i="type"></label><select id="type"></select></div>
      <div><label for="karat" data-i="karat"></label><select id="karat"><option>18</option><option selected>21</option><option>24</option></select></div>
      <div><label for="weight" data-i="weight"></label><input id="weight" type="number" min="0" step="any" inputmode="decimal" required></div>
      <div><label for="date" data-i="date"></label><input id="date" type="date" required></div>
      <div><label for="gp" data-i="gramPrice"></label><input id="gp" type="number" min="0" step="any" inputmode="decimal"></div>
      <div><label for="fee" data-i="fee"></label><input id="fee" type="number" min="0" step="any" inputmode="decimal"></div>
      <div class="full"><label for="total" data-i="total"></label><input id="total" type="number" min="0" step="any" inputmode="decimal"><div class="hint" data-i="totalHint"></div></div>
      <div class="full"><label for="photo" data-i="photo"></label><input id="photo" type="file" accept="image/*"></div>
      <div class="full"><label for="notes" data-i="notes"></label><textarea id="notes" rows="2"></textarea></div>
      <button class="btn primary full" type="submit" data-i="save"></button>
    </form>
  </div>
</section>

<section class="view" data-v="items" hidden>
  <div class="panel"><h2 data-i="items"></h2><div id="list"></div></div>
</section>

<section class="view" data-v="rates" hidden>
  <div class="panel">
    <h2 data-i="market"></h2>
    <label for="sheet" data-i="sheet"></label><input id="sheet" type="file" accept="image/*">
    <div class="verdict" id="pstat" style="margin-top:10px" aria-live="polite"></div>
    <table class="ledger" id="ptbl" style="margin-top:8px"></table>
    <img id="sheetImg" class="sheet" alt="" hidden>
    <div class="hint"><a href="https://sbaik.sa/%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%A7%D9%84%D8%B0%D9%87%D8%A8/page-236935306" target="_blank" rel="noreferrer" data-i="rateLink"></a></div>
  </div>
  <details class="panel" open><summary data-i="manual"></summary><div class="fields" style="margin-top:12px">
    <div class="full k3"><div><label for="p24" data-i="price24"></label><input id="p24" type="number" min="0" step="any" inputmode="decimal"></div><div><label for="p21" data-i="price21"></label><input id="p21" type="number" min="0" step="any" inputmode="decimal"></div><div><label for="p18" data-i="price18"></label><input id="p18" type="number" min="0" step="any" inputmode="decimal"></div></div>
    <div><label for="pdate" data-i="pdate"></label><input id="pdate" type="date"></div>
    <div><label for="egp" data-i="egpRate"></label><input id="egp" type="number" min="0" step="any" inputmode="decimal"></div>
    <div class="full hint" data-i="pHint"></div>
    <div class="full btns"><button type="button" class="btn" id="bak" data-i="backup"></button><label class="btn" style="margin:0;display:inline-block"><span data-i="restore"></span><input id="imp" type="file" accept=".json,application/json" hidden></label></div>
  </div></details>
</section>

<section class="view" data-v="zakat" hidden>
  <div class="panel"><h2 data-i="zakat"></h2><div class="verdict" id="zakat"></div></div>
  <div class="panel">
    <h2 data-i="years"></h2>
    <label for="year" data-i="pickYear"></label><select id="year"></select>
    <table class="ledger" id="yearTbl" style="margin-top:8px"></table>
  </div>
</section>
</main>
</div>
<div id="printArea"></div>

<script>
const T={

};
const CATS=["Gold yassmin","Karam Gold"],VIEWS=[["home","nHome"],["add","nAdd"],["items","nItems"],["rates","nRates"],["zakat","nZakat"]];
const $=id=>document.getElementById(id);
const K=[24,21,18],KC={24:"#c9a227",21:"#1f8f7f",18:"#c0456f"};
const PRESET=null; // مثال: {date:"2026-10-06",p24:"",p21:"",p18:"",egp:""}
let S={lang:"ar",theme:"",cat:CATS[0],p24:"",p21:"",p18:"",pdate:"",egp:"",items:[],year:new Date().getFullYear()};

function render(){

  const its=S.items.filter(i=>i.category===S.cat);
  const w=its.reduce((a,i)=>a+i.weight,0),pure=its.reduce((a,i)=>a+i.weight*i.karat/24,0);
  const cost=its.reduce((a,i)=>a+i.totalCost,0),p=parseFloat(S.p24)||0,r=parseFloat(S.egp)||0;
  const val=its.reduce((a,i)=>a+i.weight*price(i.karat),0),pr=val-cost,hasP=K.some(k=>price(k)>0);
  $("tval").textContent=hasP?n(val):"-";
  $("kgrid").innerHTML=K.map(k=>{const g=its.filter(i=>i.karat===k),gw=g.reduce((a,i)=>a+i.weight,0),pk=price(k);return `<div class="kcard" style="--c:var(--k${k})"><b>${t.karat2} ${k}</b><div class="num-lg">${n(gw)}<small>${t.g}</small></div><span>${g.length} ${t.pcs}${pk&&gw?" · "+n(gw*pk)+" SAR":""}</span></div>`}).join("");
    const both=x=>n(x)+" SAR"+(r?`<small>${n(x*r)} EGP</small>`:"");
  $("ledger").innerHTML=(hasP?`<tr><td>${t.value}</td><td>${both(val)}</td></tr><tr><td>${t.profit}</td><td class="${pr>=0?"pos":"neg"}">${both(pr)}</td></tr>`:"");

  const row=i=>`<div class="item">${i.image?`<img class="thumb" src="${i.image}" alt="">`:`<div class="thumb">${i.karat}</div>`}<div><b>${t.types[i.type]||i.type} · ${i.karat}K</b><span>${n(i.weight)} ${t.g} · ${i.date} · ${n(i.totalCost)} SAR${i.notes?" · "+esc(i.notes):""}</span></div><button class="del" data-d="${i.id}">${t.del}</button></div>`;
  $("list").innerHTML=its.length?K.map(k=>{const g=its.filter(i=>i.karat===k).sort((a,b)=>b.date.localeCompare(a.date));if(!g.length)return"";return `<div class="grp" style="--c:var(--k${k})"><div class="gh"><b>${t.karat2} ${k}</b><span>${g.length} ${t.pcs} · ${n(g.reduce((a,i)=>a+i.weight,0))} ${t.g}</span></div>${g.map(row).join("")}</div>`}).join(""):`<div class="empty">${t.none}</div>`;

  $("zakat").innerHTML=!its.length?t.zEmpty:pure>=85?`${t.zYes} <b>${n(pure*.025,3)} ${t.g}</b>${p?` (${n(pure*.025*p)} SAR)`:""}`:`${t.zNo} <b>${n(85-pure)} ${t.g}</b>`;
  const ys=[...new Set([new Date().getFullYear(),...S.items.map(i=>new Date(i.date).getFullYear())])].sort((a,b)=>b-a);
  $("year").innerHTML=ys.map(y=>`<option ${y==S.year?"selected":""}>${y}</option>`).join("");
  const yi=its.filter(i=>new Date(i.date).getFullYear()==S.year);
  $("yearTbl").innerHTML=`<tr><td>${t.yCount}</td><td>${yi.length}</td></tr><tr><td>${t.yWeight}</td><td>${n(yi.reduce((a,i)=>a+i.weight,0))} ${t.g}</td></tr><tr><td>${t.yCost}</td><td>${n(yi.reduce((a,i)=>a+i.totalCost,0))} SAR</td></tr>`;
}

$("seg").onclick=e=>{const c=e.target.dataset.c;if(c){S.cat=c;save();render()}};
$("nav").onclick=e=>{const v=e.target.dataset.v;if(v)go(v)};
$("lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";save();render()};
$("theme").onclick=()=>{S.theme=isDark()?"light":"dark";save();render()};
const groupsOf=()=>{const its=S.items.filter(i=>i.category===S.cat);return K.map(k=>[k,its.filter(i=>i.karat===k).sort((a,b)=>b.date.localeCompare(a.date))]).filter(g=>g[1].length)};
const printNow=()=>{
  const t=T[S.lang],gs=groupsOf();if(!gs.length)return;
  const all=gs.flatMap(g=>g[1]),tw=all.reduce((a,i)=>a+i.weight,0),tv=all.reduce((a,i)=>a+i.weight*price(i.karat),0);
  $("printArea").innerHTML=`<div class="pa"><h1>${t.title} - ${esc(S.cat)}</h1><p>${new Date().toLocaleDateString(S.lang==="ar"?"ar-SA-u-nu-latn":"en-GB")}</p>`+gs.map(([k,g])=>`<div class="pg" style="--c:${KC[k]}"><div class="gh"><b>${t.karat2} ${k}</b><span>${g.length} ${t.pcs} · ${n(g.reduce((a,i)=>a+i.weight,0))} ${t.g}</span></div>${g.map(i=>`<div class="pr">${i.image?`<img class="thumb" src="${i.image}" alt="">`:`<div class="thumb">${k}</div>`}<div><b>${t.types[i.type]||i.type}</b><small>${i.date}${i.notes?" · "+esc(i.notes):""}</small></div><b>${n(i.weight)} ${t.g}</b></div>`).join("")}</div>`).join("")+`<div class="tot"><span>${t.grand}: ${all.length} ${t.pcs}</span><span>${n(tw)} ${t.g}${tv?" · "+n(tv)+" SAR":""}</span></div></div>`;
  window.print();
};
const buildCanvas=async()=>{
  const t=T[S.lang],rtl=S.lang==="ar",gs=groupsOf();if(!gs.length)return null;
  try{await document.fonts.ready}catch(e){}
  const all=gs.flatMap(g=>g[1]),imgs={};
  await Promise.all(all.filter(i=>i.image).map(i=>new Promise(r=>{const im=new Image();im.onload=()=>{imgs[i.id]=im;r()};im.onerror=r;im.src=i.image})));
  const W=1100,P=40,RH=84,GH=56,F='"Cairo",system-ui,sans-serif';
  const H=P*2+90+gs.reduce((a,[,g])=>a+GH+g.length*RH+24,0)+60;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);x.direction=rtl?"rtl":"ltr";x.textBaseline="middle";
  const sx=(o,w)=>rtl?W-P-o-w:P+o,ax=o=>rtl?W-P-o:P+o,ex=()=>rtl?P:W-P,al=rtl?"right":"left",ol=rtl?"left":"right";
  const tx=(s,X,Y,A,f,col)=>{x.font=f+" "+F;x.fillStyle=col;x.textAlign=A;x.fillText(s,X,Y)};
  let y=P;const cuts=[];
  tx(t.title+" - "+S.cat,ax(0),y+20,al,"700 34px","#111");
  tx(new Date().toLocaleDateString(rtl?"ar-SA-u-nu-latn":"en-GB"),ax(0),y+62,al,"400 20px","#555");
  y+=100;
  gs.forEach(([k,g])=>{
    const col=KC[k];
    x.globalAlpha=.25;x.fillStyle=col;x.fillRect(P,y,W-2*P,GH);x.globalAlpha=1;
    x.fillStyle=col;x.fillRect(sx(0,10),y,10,GH);
    tx(t.karat2+" "+k,ax(26),y+GH/2,al,"700 26px","#111");
    tx(g.length+" "+t.pcs+" · "+n(g.reduce((a,i)=>a+i.weight,0))+" "+t.g,ex(),y+GH/2,ol,"600 22px","#111");
    y+=GH;
    g.forEach(i=>{
      x.strokeStyle="#ddd";x.lineWidth=1;x.beginPath();x.moveTo(P,y+RH);x.lineTo(W-P,y+RH);x.stroke();
      const tl=sx(0,64),ty=y+10;
      if(imgs[i.id]){const im=imgs[i.id],q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,tl,ty,64,64)}
      else tx(String(k),tl+32,ty+32,"center","700 24px",col);
      x.strokeStyle=col;x.lineWidth=3;x.strokeRect(tl,ty,64,64);
      tx(t.types[i.type]||i.type,ax(80),y+28,al,"600 24px","#111");
      tx(i.date+(i.notes?" · "+i.notes:""),ax(80),y+58,al,"400 18px","#555");
      tx(n(i.weight)+" "+t.g,ex(),y+RH/2,ol,"700 26px","#111");
      y+=RH;cuts.push(y);
    });
    y+=24;cuts.push(y);
  });
  const tw=all.reduce((a,i)=>a+i.weight,0),tv=all.reduce((a,i)=>a+i.weight*price(i.karat),0);
  x.fillStyle="#111";x.fillRect(P,y,W-2*P,2);
  tx(t.grand+": "+all.length+" "+t.pcs,ax(0),y+36,al,"700 24px","#111");
  tx(n(tw)+" "+t.g+(tv?" · "+n(tv)+" SAR":""),ex(),y+36,ol,"700 24px","#111");
  return{c,cuts};
};
const dl=async(name,data)=>{
  try{const d=window.claude?await window.claude.use("downloads"):null;if(d){await d.save({filename:name,data});return}}catch(e){return}
  const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
const fname=ext=>"gold-"+S.cat.replace(/\s+/g,"-")+"."+ext;
$("png").onclick=async()=>{const r=await buildCanvas();if(r)r.c.toBlob(b=>dl(fname("png"),b))};
$("pdf").onclick=async()=>{
  const r=await buildCanvas();if(!r||!window.jspdf)return;
  const {c,cuts}=r,PH=Math.round(c.width*1.414),pdf=new window.jspdf.jsPDF({unit:"px",format:[c.width,PH]});
  let st=0,first=true;
  while(st<c.height-1){
    let en=Math.min(c.height,st+PH);
    if(en<c.height){const k=cuts.filter(v=>v>st+40&&v<=en).pop();if(k)en=k}
    const sl=document.createElement("canvas");sl.width=c.width;sl.height=en-st;const x=sl.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,sl.width,sl.height);x.drawImage(c,0,st,c.width,en-st,0,0,c.width,en-st);
    if(!first)pdf.addPage([c.width,PH]);first=false;
    pdf.addImage(sl.toDataURL("image/jpeg",.92),"JPEG",0,0,c.width,en-st);st=en;
  }
  dl(fname("pdf"),pdf.output("blob"));
};
$("bak").onclick=()=>dl("gold-backup.json",new Blob([JSON.stringify(S)],{type:"application/json"}));
$("imp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(Array.isArray(o.items)){Object.assign(S,o);save();render()}}catch(x){}};r.readAsText(f);e.target.value=""};
["p24","p21","p18","egp","pdate"].forEach(id=>{$(id).oninput=e=>{S[id]=e.target.value;save();render()}});
[24,21,18].forEach(k=>{$("h"+k).oninput=e=>{S["p"+k]=e.target.value;save();render()}});
$("year").onchange=e=>{S.year=+e.target.value;save();render()};
const shrink=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const q=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*q);c.height=Math.round(im.height*q);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};im.onerror=rej;im.src=u});
const PROMPT='This image is a screenshot of current gold prices in Saudi Arabia. Extract the price per gram in Saudi riyals for 24K, 21K and 18K. If both buy and sell prices appear, use the sell price. If prices are per ounce, tola or gold pound (8 g of 21K), convert to per gram. Reply with only JSON: {"p24":number|null,"p21":number|null,"p18":number|null,"date":"YYYY-MM-DD"|null,"basis":"one short Arabic phrase saying which price you used"}. Use null for anything not visible. Never guess.';
$("sheet").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const t=T[S.lang];
  read(f,d=>{sheetData=d;render()});
  pmsg=t.reading;render();
  try{
    const sample=window.claude?await window.claude.use("sample"):null;
    if(!sample){pmsg=t.noAI;return}
    const r=await sample.json(PROMPT,{images:await shrink(f),modelTier:"default"});
    const num=v=>{v=parseFloat(v);return v>0?String(v):""};
    const v={p24:num(r.p24),p21:num(r.p21),p18:num(r.p18)};
    if(!Object.values(v).some(Boolean)){pmsg=t.fail;return}
    Object.assign(S,v,{pdate:/^\d{4}-\d\d-\d\d$/.test(r.date||"")?r.date:new Date().toISOString().slice(0,10)});
    pmsg=t.done+(r.basis?" - "+r.basis:"");save();
  }catch(err){pmsg=err&&err.code==="not_granted"?t.noAI:t.fail}
  finally{render();e.target.value=""}
};
$("photo").onchange=e=>read(e.target.files[0],d=>photoData=d);
$("list").onclick=e=>{const id=e.target.dataset.d;if(id){S.items=S.items.filter(i=>i.id!=id);save();render()}};
$("form").onsubmit=e=>{
  e.preventDefault();
  const w=parseFloat($("weight").value)||0;if(!w)return;
  const gp=parseFloat($("gp").value)||0,fee=parseFloat($("fee").value)||0;
  const totalCost=(gp||fee)?(gp+fee)*w:(parseFloat($("total").value)||0);
  S.items.push({id:Date.now(),category:S.cat,type:$("type").value,karat:+$("karat").value,weight:w,date:$("date").value,gramBuyPrice:gp,makingFee:fee,totalCost,image:photoData,notes:$("notes").value.trim()});
  photoData=null;$("form").reset();$("date").value=new Date().toISOString().slice(0,10);$("karat").value=21;
  save();render();go("items");
};
$("date").value=new Date().toISOString().slice(0,10);
render();go("home");
</script>
