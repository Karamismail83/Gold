.tools{display:flex;gap:8px}

.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

nav button[aria-current="page"]{color:var(--accent);font-weight:600;border-top-color:var(--brass)}
@media(min-width:800px){nav{position:static;border:1px solid var(--line);border-radius:10px;margin-bottom:20px;padding:0;overflow:hidden}nav button{font-size:1rem;border-top:0;border-bottom:3px solid transparent}nav button[aria-current="page"]{border-bottom-color:var(--brass)}.wrap{padding-bottom:40px}}
.view[hidden]{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k3 label{font-size:.82rem}
.k4{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.k4 label{font-size:1.1rem;white-space:nowrap;text-align:center;font-weight:600;margin-bottom:6px}.k4 input{text-align:center;padding:10px 4px}.tval{display:block;padding:10px 4px;border:1px solid var(--brass);border-radius:8px;background:color-mix(in srgb,var(--brass) 16%,var(--surface));font-weight:600;font-size:.85rem;text-align:center;overflow-wrap:anywhere;min-height:44px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
a{color:var(--accent)}
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:11px 0;border-bottom:1px solid var(--line)}
.ledger tr:last-child td{border:0}
.ledger td:last-child{text-align:start;font-weight:600;font-variant-numeric:tabular-nums}
.ledger small{color:var(--muted);font-weight:400;display:block}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--ph,var(--bg));border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;color:var(--brass);font-family:"Amiri";font-size:1.1rem}
.item b{display:block}.item span{color:var(--muted);font-size:.88rem}
.del{border:0;background:none;color:var(--neg);cursor:pointer;padding:8px}
.empty{color:var(--muted);padding:12px 0}

.sheet{max-width:100%;border-radius:8px;margin-top:10px;border:1px solid var(--line)}
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}

</main>
</div>

[24,21,18].forEach(k=>{$("h"+k).oninput=e=>{S["p"+k]=e.target.value;save();render()}});
$("year").onchange=e=>{S.year=+e.target.value;save();render()};
const shrink=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const q=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*q);c.height=Math.round(im.height*q);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};im.onerror=rej;im.src=u});
const PROMPT='This image is a screenshot of current gold prices in Saudi Arabia. Extract the price per gram in Saudi riyals for 24K, 21K and 18K. If both buy and sell prices appear, use the sell price. If prices are per ounce, tola or gold pound (8 g of 21K), convert to per gram. Reply with only JSON: {"p24":number|null,"p21":number|null,"p18":number|null,"date":"YYYY-MM-DD"|null,"basis":"one short Arabic phrase saying which price you used"}. Use null for anything not visible. Never guess.';
$("sheet").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const t=T[S.lang];
  read(f,d=>{sheetData=d;render()});
  pmsg=t.reading;render();
  try{
    const sample=window.claude?await window.claude.use("sample"):null;
    if(!sample){pmsg=t.noAI;return}
    const r=await sample.json(PROMPT,{images:await shrink(f),modelTier:"default"});
    const num=v=>{v=parseFloat(v);return v>0?String(v):""};
    const v={p24:num(r.p24),p21:num(r.p21),p18:num(r.p18)};
    if(!Object.values(v).some(Boolean)){pmsg=t.fail;return}
    Object.assign(S,v,{pdate:/^\d{4}-\d\d-\d\d$/.test(r.date||"")?r.date:new Date().toISOString().slice(0,10)});
    pmsg=t.done+(r.basis?" - "+r.basis:"");save();
  }catch(err){pmsg=err&&err.code==="not_granted"?t.noAI:t.fail}
  finally{render();e.target.value=""}
};
let photoP=null;$("photo").onchange=e=>read(e.target.files[0],d=>{photoData=null;photoP=d?enhance(d):null});
$("list").onclick=e=>{const id=e.target.dataset.d;if(id){idb("del",+id);S.items=S.items.filter(i=>i.id!=id);save();render()}};
$("form").onsubmit=async e=>{
  e.preventDefault();if(photoP){try{photoData=await photoP}catch(x){}}photoP=null;
  const w=parseFloat($("weight").value)||0;if(!w)return;
  const gp=parseFloat($("gp").value)||0,fee=parseFloat($("fee").value)||0;
  const totalCost=(gp||fee)?(gp+fee)*w:(parseFloat($("total").value)||0),id=Date.now();
  if(photoData)idb("put",id,photoData);
  S.items.push({id,category:S.cat,type:$("type").value,karat:+$("karat").value,weight:w,date:$("date").value,gramBuyPrice:gp,makingFee:fee,totalCost,image:photoData,enh:photoData?1:0,notes:$("notes").value.trim()});
  photoData=null;$("form").reset();$("date").value=new Date().toISOString().slice(0,10);$("karat").value=21;
  save();render();go("items");
};
$("date").value=new Date().toISOString().slice(0,10);
render();go("home");
</script>
